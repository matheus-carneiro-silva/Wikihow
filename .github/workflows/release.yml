# Gera o APK de uma nova versão. Dois jeitos de disparar:
#
#   1. Publicar uma Release no GitHub com a tag v1.2.0: o APK é anexado a ela.
#   2. Actions → Release Android → Run workflow, informando a versão (1.2.0):
#      compila e, só se o build der certo, cria a Release v1.2.0 com o APK.
#
# A versão vira o "version" do app. O versionCode é incrementado pelos servidores
# da Expo (appVersionSource "remote" + autoIncrement no perfil production).
#
# Pré-requisitos (uma vez só; ver "Versões e builds" no README):
#   - secret EXPO_TOKEN no repositório
#   - workflow "Configurar EAS" executado (liga o projeto à conta Expo)
# A chave de assinatura é gerada pela Expo no primeiro build e reutilizada depois.
name: Release Android

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      versao:
        description: Versão no formato 1.2.3 (cria a Release v1.2.3)
        required: true
        type: string

permissions:
  contents: write # criar a Release e anexar o APK

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.versao }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build do APK
    runs-on: ubuntu-latest
    # O build roda na nuvem da Expo; no plano gratuito pode haver fila.
    timeout-minutes: 180
    env:
      # Release publicada: a tag dela. Disparo manual: "v" + versão informada.
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', inputs.versao) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validar a versão
        run: |
          if [[ ! "$TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::\"$TAG\" não é uma versão no formato v1.2.3."
            exit 1
          fi
          echo "VERSAO=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::A Release $TAG já existe. Escolha outra versão."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Verificar configuração do EAS
        run: |
          if [ -z "$(jq -r '.expo.extra.eas.projectId // empty' app.json)" ]; then
            echo "::error::Projeto ainda não ligado ao EAS. Rode antes o workflow \"Configurar EAS\" (Actions → Configurar EAS → Run workflow)."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testes
        run: npm test

      - name: Tipos
        run: npm run typecheck

      - name: Aplicar a versão no app.json
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = process.env.VERSAO;
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
          '
          echo "Versão do app: $VERSAO"

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build na Expo
        # O EAS envia o diretório atual, incluindo o app.json alterado acima.
        run: eas build --platform android --profile production --non-interactive --wait --json > build.json

      - name: Baixar o APK
        run: |
          URL=$(jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl // empty' build.json)
          if [ -z "$URL" ]; then
            echo "::error::O build terminou sem APK. Resposta do EAS:"
            cat build.json
            exit 1
          fi
          echo "ARQUIVO=wikihow-$TAG.apk" >> "$GITHUB_ENV"
          curl -fsSL -o "wikihow-$TAG.apk" "$URL"

      - name: Criar a Release (disparo manual)
        if: github.event_name == 'workflow_dispatch'
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

      - name: Anexar o APK na Release
        run: |
          gh release upload "$TAG" "$ARQUIVO" --clobber
          echo "### APK $TAG anexado à Release" >> "$GITHUB_STEP_SUMMARY"
