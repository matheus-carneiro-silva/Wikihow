<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Inter, sans-serif">
  <rect width="800" height="500" fill="#f4f6f9"/>
  <text x="400" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#1b1f24">Ordem de aperto: sempre o parafuso oposto</text>
  <!-- roda de 4 parafusos -->
  <g>
    <circle cx="210" cy="260" r="150" fill="#3c4043"/>
    <circle cx="210" cy="260" r="108" fill="#dadce0"/>
    <circle cx="210" cy="260" r="34" fill="#bdc1c6"/>
    <polyline points="210,195 210,325 275,260 145,260" fill="none" stroke="#1a73e8" stroke-width="4" stroke-dasharray="10 7" stroke-linejoin="round"/>
    <g font-size="22" font-weight="700" fill="#fff" text-anchor="middle">
      <circle cx="210" cy="195" r="21" fill="#1a73e8"/><text x="210" y="203">1</text>
      <circle cx="210" cy="325" r="21" fill="#1a73e8"/><text x="210" y="333">2</text>
      <circle cx="275" cy="260" r="21" fill="#1a73e8"/><text x="275" y="268">3</text>
      <circle cx="145" cy="260" r="21" fill="#1a73e8"/><text x="145" y="268">4</text>
    </g>
    <text x="210" y="460" text-anchor="middle" font-size="22" font-weight="600" fill="#5c6670">4 parafusos</text>
  </g>
  <!-- roda de 5 parafusos -->
  <g>
    <circle cx="590" cy="260" r="150" fill="#3c4043"/>
    <circle cx="590" cy="260" r="108" fill="#dadce0"/>
    <circle cx="590" cy="260" r="34" fill="#bdc1c6"/>
    <polyline points="590,192 630,315 525,239 655,239 550,315" fill="none" stroke="#1a73e8" stroke-width="4" stroke-dasharray="10 7" stroke-linejoin="round"/>
    <g font-size="22" font-weight="700" fill="#fff" text-anchor="middle">
      <circle cx="590" cy="192" r="21" fill="#1a73e8"/><text x="590" y="200">1</text>
      <circle cx="630" cy="315" r="21" fill="#1a73e8"/><text x="630" y="323">2</text>
      <circle cx="525" cy="239" r="21" fill="#1a73e8"/><text x="525" y="247">3</text>
      <circle cx="655" cy="239" r="21" fill="#1a73e8"/><text x="655" y="247">4</text>
      <circle cx="550" cy="315" r="21" fill="#1a73e8"/><text x="550" y="323">5</text>
    </g>
    <text x="590" y="460" text-anchor="middle" font-size="22" font-weight="600" fill="#5c6670">5 parafusos</text>
  </g>
