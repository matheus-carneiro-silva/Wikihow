<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Inter, sans-serif">
  <rect width="800" height="500" fill="#f4f6f9"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1b1f24">Onde encontrar a pressão correta</text>
  <!-- carro (frente para a direita: lado do motorista) -->
  <g transform="translate(800,0) scale(-1,1)">
    <path d="M90 340 L90 285 Q95 258 132 252 L242 240 L300 182 Q310 172 326 172 L522 172 Q542 172 554 186 L610 244 L688 256 Q714 262 714 288 L714 340 Z" fill="#8ab4f8"/>
    <path d="M312 186 L405 186 L405 238 L264 238 Z" fill="#e8f0fe"/>
    <path d="M415 186 L514 186 Q527 186 535 196 L578 238 L415 238 Z" fill="#e8f0fe"/>
    <path d="M410 182 L410 330 M258 242 L258 330 M580 244 L580 330" stroke="#5e8fe0" stroke-width="3" fill="none"/>
    <rect x="380" y="262" width="22" height="7" rx="3" fill="#5e8fe0"/>
    <rect x="550" y="262" width="22" height="7" rx="3" fill="#5e8fe0"/>
    <circle cx="230" cy="340" r="60" fill="#f4f6f9"/>
    <circle cx="570" cy="340" r="60" fill="#f4f6f9"/>
    <circle cx="230" cy="340" r="48" fill="#3c4043"/><circle cx="230" cy="340" r="22" fill="#bdc1c6"/>
    <circle cx="570" cy="340" r="48" fill="#3c4043"/><circle cx="570" cy="340" r="22" fill="#bdc1c6"/>
    <!-- etiqueta na coluna da porta -->
    <rect x="412" y="250" width="16" height="30" rx="2" fill="#fff" stroke="#e8710a" stroke-width="3"/>
    <!-- tampa do tanque -->
    <circle cx="650" cy="276" r="13" fill="#5e8fe0" stroke="#e8710a" stroke-width="3"/>
  </g>
  <!-- chamadas -->
  <g font-size="20" fill="#1b1f24">
    <path d="M380 252 L380 120 L470 120" stroke="#e8710a" stroke-width="3" fill="none"/>
    <circle cx="380" cy="265" r="22" fill="none" stroke="#e8710a" stroke-width="3"/>
    <text x="480" y="115" font-weight="700">Etiqueta na coluna</text>
    <text x="480" y="140">da porta do motorista</text>
    <path d="M150 292 L150 420 L210 420" stroke="#e8710a" stroke-width="3" fill="none"/>
    <text x="220" y="414" font-weight="700">Tampa do tanque</text>
    <text x="220" y="439">(em alguns modelos)</text>
    <text x="760" y="452" text-anchor="end" font-size="18" fill="#5c6670">Ou no manual do carro, em psi (libras)</text>
  </g>
</svg>
